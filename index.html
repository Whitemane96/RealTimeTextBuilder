<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Text Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="customFields.js"></script>
    <script src="getData.js"></script>
    <script src="grammarHelpers.js"></script>
    <script src="previewUpdater.js"></script>
    <script src="sentenceBuilder.js"></script>
  </head>
  <body>
    <div id="layout">
      <div id="leftColumn">

        <h2>Text menu</h2>
    
        <label>Text input field:</label>
        <input type="text" id="text_input" placeholder="This is some text..." oninput="updatePreview()">

        <label>Number input field:</label>
        <input type="number" id="number_input" placeholder="5" min="0" step="1" oninput="updatePreview()">

        <label>Date input field:</label>
        <input type="date" id="date_input" oninput="updatePreview()">

        <label>Dropdown menu selection. Changes wording based on selection:</label>
        <select id="dropdown_selection" oninput="updatePreview()">
            <option value="">-- Select --</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="non_binary">Non Binary</option>
        </select>

        <label>Radio button selection. Changes text based on selection too:</label>
        <div id="radio_selection">
          <p><input type="radio" name="radio_choice" value="driving ___ car" onchange="updatePreview()"> Driving his/her/their car </p>
          <p><input type="radio" name="radio_choice" value="driving ___ bike" onchange="updatePreview()"> Driving his/her/their bike </p>
        </div>

        <label>Checkbox selection. Fixes grammar for multiple options selected:</label>
        <div id="checkbox_selection">
          <p><input type="checkbox" value="apples" onchange="updatePreview()"> Apples </p>
          <p><input type="checkbox" value="oranges" onchange="updatePreview()"> Oranges </p>
          <p><input type="checkbox" value="bananas" onchange="updatePreview()"> Bananas </p>
        </div>

        <label>Add many things with this:</label>
        <button type="button" class="btn-primary" onclick="addCustomField(); updatePreview();">Add Field</button>
        <div id="customFieldsContainer"></div>

        <label>Add a paragraph here too:</label>
        <textarea id="paragraph" cols="50" rows="10" oninput="updatePreview()"></textarea>
      </div>

      <div id="rightColumn">
        <h2>Real-time text preview.<br/>Start writing or choosing options :)</h2>
        <pre id="previewBox"></pre>
      </div>

    </div>
  </body>
</html>
